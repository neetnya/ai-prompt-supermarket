<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 绘画提示词超市</title>
<!--
  ════════════════════════════════════════════════════════════
  AI 绘画提示词超市 — 结构导航 + 维护手册
  ════════════════════════════════════════════════════════════

  本文件是模板壳（src/template.html），与 src/style.css、src/rules.mjs、
  src/parser.mjs、src/app.js 以及 tag.sqlite 一起，由 `node tools/build.mjs`
  内联构建为单文件产物 ai-prompt-supermarket.html（已 gitignore，不要手改产物）。

  源码结构：
  src/template.html  HTML 骨架与内联占位符
  src/style.css      全部样式（深色主题、弹窗、Toast、权重编辑器）
  src/rules.mjs      精选分类 CURATED / 自动归类 AUTO / 翻译补丁 CURATED_ZH / 二级分类 SUBS
  src/parser.mjs     tagKey / 括号转义 / 回填解析器（纯函数）
  src/app.js         状态管理、惰性索引、面板渲染、拖拽排序、排序整理、全局搜索
  tools/build.mjs    零依赖构建与校验脚本（node tools/build.mjs [--check|--stats]）
-->
<style>
/*__STYLE_CSS__*/
</style>
</head>
<body>

<div class="topbar">
  <div class="head">
    <div class="head-left">
      <h1>AI 绘画提示词超市</h1>
      <span class="meta" id="meta"></span>
    </div>
    <!-- ① 全局标签搜索（直接加入提示词，不用开标签库）：收窄后嵌进标题栏正中 -->
    <div class="search">
      <input id="search" type="text" placeholder="🔍 全局搜索全量标签（中文 / 英文，支持 ↑↓ 选择、Enter 加入）" autocomplete="off">
      <div class="results" id="searchRes" role="listbox" aria-label="搜索结果"></div>
    </div>
    <div class="head-right">
      <button class="btn ghost" id="outputLangBtn" onclick="toggleOutputLanguage()" title="只切换输出格式，保留标签、顺序、正负和权重">输出语言：English</button>
      <button class="btn primary" id="openLibBtn" onclick="openLibrary()" title="打开标签库（分类浏览）">选择标签</button>
    </div>
  </div>

  <!-- ② 工作区：左列上正面下负面提示词，右列同位置上正面下负面胶囊 -->
  <div class="workspace">
    <div class="col">
      <div class="obox">
        <label>正面提示词 <span class="cnt" id="posCnt">0</span>
          <span class="acts">
            <button class="mini danger" onclick="clearUnmatched(false)" title="清理正面区未识别到数据库的原文标签">清未识别</button>
            <button class="mini" onclick="copyPos()" title="复制正面提示词">复制</button>
          </span>
        </label>
        <textarea id="posOut" class="pos" placeholder="点击标签自动生成；也可直接粘贴已有提示词，自动识别成胶囊（匹配数据库显示中文，未匹配保留原文）…"></textarea>
      </div>
      <div class="obox">
        <label>负面提示词 <span class="cnt" id="negCnt">0</span>
          <span class="acts">
            <button class="mini danger" onclick="clearUnmatched(true)" title="清理负面区未识别到数据库的原文标签">清未识别</button>
            <button class="mini" onclick="copyNeg()" title="复制负面提示词">复制</button>
          </span>
        </label>
        <textarea id="negOut" class="neg" placeholder="负面词分类的标签或手动翻转到负面的标签会进这里；同样支持粘贴识别…"></textarea>
      </div>
    </div>
    <div class="col">
      <div class="chipbox">
        <label>正面标签 <span class="cnt" id="posChipCnt">0</span>
          <button class="mini" onclick="openSorter('pos')" title="分组整理标签顺序（按分类 / 手动归类）">排序整理</button>
          <button class="mini" onclick="resetWeights(false)" title="一键将正面区所有标签的权重重置为默认（1）">重置权重</button>
          <span class="tip">拖动排序 · 右键设权重</span>
        </label>
        <div class="chips" id="posChips"></div>
      </div>
      <div class="chipbox">
        <label>负面标签 <span class="cnt" id="negChipCnt">0</span>
          <button class="mini" onclick="openSorter('neg')" title="分组整理标签顺序（按分类 / 手动归类）">排序整理</button>
          <button class="mini" onclick="resetWeights(true)" title="一键将负面区所有标签的权重重置为默认（1）">重置权重</button>
          <span class="tip">± 可翻回正面</span>
        </label>
        <div class="chips" id="negChips"></div>
      </div>
    </div>
  </div>
</div>

<!-- ③ 标签库弹窗：分类胶囊 + 二级分类 + 标签面板 -->
<div class="mask" id="libMask" onclick="if(event.target===this)closeLibrary()">
  <div class="modal" role="dialog" aria-modal="true" aria-label="标签库">
    <div class="m-head">
      <span class="t">标签库</span>
      <span class="sel" id="libCount"></span>
      <span class="hint">点击标签加入提示词，再次点击取消</span>
      <button class="x" onclick="closeLibrary()" title="关闭（Esc）">×</button>
    </div>
    <div class="pills-row">
      <div class="pills-fixed" id="allPill"></div>
      <div class="pills-scroll" id="pills"></div>
    </div>
    <div class="subs-row" id="subsRow"></div>
    <div class="tagpanel" id="tagpanel"></div>
  </div>
</div>

<!-- ④ 排序整理弹窗：一键按分类分组，或手动建组后把标签拖进对应组 -->
<div class="mask sorter-mask" id="sorterMask" onclick="if(event.target===this)closeSorter()">
  <div class="modal sorter" role="dialog" aria-modal="true" aria-label="排序整理">
    <div class="m-head">
      <span class="t">排序整理</span>
      <span class="sel" id="sorterSide"></span>
      <span class="hint">拖动胶囊归类；组标题可改名；双击胶囊改文本；右键设权重；× 删除标签（应用后生效）</span>
      <button class="x" onclick="closeSorter()" title="关闭（Esc）">×</button>
    </div>
    <div class="sorter-tools">
      <button class="btn ghost" onclick="sorterAutoGroup()" title="按筛选窗口的分类顺序自动分组，未识别的进入未分组">一键按分类排序</button>
      <button class="btn ghost" onclick="sorterAddGroup()" title="新建一个空分组，放到未分组之前">＋ 新建分组</button>
      <button class="btn ghost" onclick="sorterMergeGroups()" title="把所有分组按当前顺序合并回未分组">合并为一组</button>
      <button class="btn ghost" onclick="sorterResetWeights()" title="将当前弹窗内所有标签的权重重置为默认（1）">重置权重</button>
      <button class="btn ghost" id="sorterUndo" onclick="sorterUndo()" title="撤销上一次自动分组 / 新建 / 删除 / 合并 / 重置权重" disabled>↶ 撤销</button>
      <span class="sorter-stat" id="sorterStat"></span>
    </div>
    <div class="sorter-body" id="sorterBody"></div>
    <div class="sorter-foot">
      <div class="sorter-preview-wrap">
        <span class="sorter-preview-label">实时预览（应用后立即写回提示词）</span>
        <div class="sorter-preview" id="sorterPreview"></div>
      </div>
      <div class="sorter-actions">
        <button class="btn ghost" onclick="closeSorter()">取消</button>
        <button class="btn primary" onclick="applySorter()">应用排序</button>
      </div>
    </div>
  </div>
</div>

<!-- ⑤ 悬浮轻提示（弹窗打开时也清晰可见） -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
